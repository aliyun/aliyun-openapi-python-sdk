name: Python test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        version: ["3.7", "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.14t", "3.15", "3.15t"]

    runs-on: ubuntu-20.04
    env:
      ACCESS_KEY_ID: ${{ secrets.ACCESS_KEY_ID }}
      ACCESS_KEY_SECRET: ${{ secrets.ACCESS_KEY_SECRET }}
      REGION_ID: ${{ vars.REGION_ID }}
      USER_ID: ${{ secrets.USER_ID }}
      ROOT_UID: ${{ secrets.ROOT_UID }}
      CONCURRENT_ID: "${{ github.run_number }}${{ strategy.job-index }}"

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.version }}
        allow-prereleases: true
    - name: Install dependencies
      run: |
        pip install coverage cryptography jmespath mock pycodestyle 'pytest<7.4.4' unittest2
    - name: Lint
      run: |
        make lint
    - name: Test
      run: |
        make test
        make coverage-report
        test -z $ACCESS_KEY_ID -a -z $ACCESS_KEY_SECRET || make functional-test
        bash <(curl -s https://codecov.io/bash)
